name: Rust solver CI

# The gate for every pull request into main (Linux only). It runs once per PR head and
# is skipped for documentation-only changes; a newer commit cancels the running check.
# A push to main (i.e. a merged PR) only rebuilds, without tests, to refresh the build
# caches: GitHub shares caches across pull requests only when they come from main.
on:
  pull_request:
    branches: ['main']
    paths-ignore: ['**.md', 'LICENSE', '.github/workflows/pr-policy.yml', 'ci/pr_policy.py']
  push:
    branches: ['main']
    paths-ignore: ['**.md', 'LICENSE', '.github/workflows/pr-policy.yml', 'ci/pr_policy.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-solver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  rust:
    name: Rust crate (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/febio_rs_solver
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/febio_rs_solver/target
            rust/febio_core/target
          key: cargo-v3-crate-${{ github.sha }}
          restore-keys: cargo-v3-crate-
      - name: Format
        if: github.event_name != 'push'
        run: cargo fmt --check
      - name: Clippy (correctness and suspicious lints are errors)
        if: github.event_name != 'push'
        run: cargo clippy --release --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Unit and integration tests
        if: github.event_name != 'push'
        run: cargo test --release
      - name: Build tests (cache warm-up on main)
        if: github.event_name == 'push'
        run: cargo test --release --no-run
      - name: FE core crate (fmt, clippy, tests incl. all Finley models)
        if: github.event_name != 'push'
        working-directory: rust/febio_core
        run: |
          python3 -c "import sys; sys.path.insert(0, '../bench/finley'); import run_finley as F; F.unpack('$RUNNER_TEMP/finley')"
          cargo fmt --check
          cargo clippy --release --all-targets -- -D clippy::correctness -D clippy::suspicious
          FINLEY_FEB_DIR="$RUNNER_TEMP/finley/src" cargo test --release

  febio:
    name: FEBio build + PARDISO-vs-Rust regression
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: ccache
        # cmake, the compilers, zlib and python3-venv are on the runner image already
        run: sudo apt-get install -y -q --no-install-recommends ccache || { grep -rlE 'packages\.microsoft\.com' /etc/apt/sources.list.d/ | xargs -r sudo rm -f; sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ccache; }
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cmbuild/rust_target
            .ccache
            ~/.cache/pip
          key: febio-build-${{ github.sha }}
          restore-keys: febio-build-
      - name: MKL (PARDISO reference)
        run: |
          ARGS=$(ci/rust/setup-mkl.sh "$RUNNER_TEMP/mkl" 2> mkl.log)
          cat mkl.log
          echo "MKL_CMAKE_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mkl/venv/lib" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake . -B cmbuild -DCMAKE_BUILD_TYPE=Release -DUSE_STATIC_STDLIBS=OFF -DUSE_RUST_SOLVER=ON
               -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $MKL_CMAKE_ARGS
      - name: Build
        run: cmake --build cmbuild -j $(nproc) && ccache -s
      - name: Python driver tests
        if: github.event_name != 'push'
        run: FEBIO4=cmbuild/bin/febio4 python3 -m unittest discover -s python/tests -v
      - name: Regression (PARDISO vs Rust) and spine smoke test
        if: github.event_name != 'push'
        # both on 2 threads, side by side on the 4-core runner
        run: |
          python3 rust/bench/finley/ci_smoke.py --febio cmbuild/bin/febio4 --workdir "$RUNNER_TEMP/smoke" \
            --threads 2 --md ci_smoke.md > ci_smoke.log 2>&1 & smoke=$!
          python3 rust/bench/ci_regression.py --febio cmbuild/bin/febio4 --workdir "$RUNNER_TEMP/runs" \
            --threads 2 --tol 1e-9 --json ci_regression.json --md ci_regression.md; reg=$?
          wait $smoke; sm=$?
          cat ci_smoke.log
          exit $(( reg || sm ))
      - name: Summary
        if: always() && github.event_name != 'push'
        run: |
          test -f ci_regression.md && cat ci_regression.md >> "$GITHUB_STEP_SUMMARY" || true
          test -f ci_smoke.md && cat ci_smoke.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: rust-solver-regression
          path: |
            ci_regression.json
            ci_regression.md
            ci_smoke.md
